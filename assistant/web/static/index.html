<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Assistant</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
<script src="/chat.js" defer></script>
<script src="/tasks.js" defer></script>
</head>
<body>
<header>
  <nav role="tablist">
    <button role="tab" data-view="chat" aria-selected="true">Chat</button>
    <button role="tab" data-view="tasks" aria-selected="false">Tâches</button>
  </nav>
  <button id="reset" type="button" class="small">Nouvelle conversation</button>
</header>

<!-- Chat with the agent (uses the model, costs tokens) -->
<section id="view-chat" class="view">
  <main id="log" aria-live="polite"></main>
  <form id="chat-form" class="bar">
    <textarea id="chat-input" rows="1" placeholder="Écris ici…" autocomplete="off"></textarea>
    <button id="chat-send" type="submit">Envoyer</button>
  </form>
</section>

<!-- To-do list, read and changed directly (no model, 0 tokens) -->
<section id="view-tasks" class="view" hidden>
  <form id="task-form" class="bar top">
    <input id="task-title" placeholder="Nouvelle tâche…" maxlength="200" autocomplete="off" required>
    <input id="task-due" type="date" aria-label="Échéance">
    <button type="submit">Ajouter</button>
  </form>
  <label class="toggle"><input id="task-show-done" type="checkbox"> Afficher les tâches terminées</label>
  <ul id="task-list"></ul>
  <p id="task-empty" class="meta" hidden>Aucune tâche 🎉</p>
</section>
</body>
</html>
