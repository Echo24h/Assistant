<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Assistant</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
<script src="/chat.js" defer></script>
<script src="/tasks.js" defer></script>
<script src="/recipes.js" defer></script>
<script src="/shopping.js" defer></script>
</head>
<body>
<header>
  <nav role="tablist">
    <button role="tab" data-view="chat" aria-selected="true">Chat</button>
    <button role="tab" data-view="tasks" aria-selected="false">Tâches</button>
    <button role="tab" data-view="recipes" aria-selected="false">Recettes</button>
    <button role="tab" data-view="shopping" aria-selected="false">Courses</button>
  </nav>
  <button id="reset" type="button" class="small" title="Nouvelle conversation"
          aria-label="Nouvelle conversation">↺</button>
</header>

<!-- Chat with the agent (uses the model, costs tokens) -->
<section id="view-chat" class="view">
  <main id="log" aria-live="polite"></main>
  <form id="chat-form" class="bar">
    <textarea id="chat-input" rows="1" placeholder="Écris ici…" autocomplete="off"></textarea>
    <button id="chat-send" type="submit">Envoyer</button>
  </form>
</section>

<!-- To-do list, read and changed directly (no model, 0 tokens) -->
<section id="view-tasks" class="view" hidden>
  <form id="task-form" class="bar top">
    <input id="task-title" placeholder="Nouvelle tâche…" maxlength="200" autocomplete="off" required>
    <input id="task-due" type="date" aria-label="Échéance">
    <select id="task-priority" aria-label="Priorité">
      <option value="high">🔴 Haute</option>
      <option value="normal" selected>Normale</option>
      <option value="low">Basse</option>
    </select>
    <button type="submit">Ajouter</button>
  </form>
  <label class="toggle"><input id="task-show-done" type="checkbox"> Afficher les tâches terminées</label>
  <ul id="task-list" class="list"></ul>
  <p id="task-empty" class="meta" hidden>Aucune tâche 🎉</p>
</section>

<!-- Recipes, shared by the household (no model, 0 tokens) -->
<section id="view-recipes" class="view" hidden>
  <form id="import-form" class="bar top">
    <input id="import-url" type="url" placeholder="Lien d'une recette…" required>
    <button type="submit">Importer</button>
  </form>
  <div class="scroll">
    <details id="recipe-new" class="card">
      <summary>✍️ Écrire une recette</summary>
      <form id="recipe-form" class="stack">
        <input id="recipe-title" placeholder="Titre" maxlength="200" required>
        <label>Pour <input id="recipe-servings" type="number" min="1" max="100" value="2" required> personnes</label>
        <textarea id="recipe-ingredients" rows="6" required
                  placeholder="Un ingrédient par ligne :&#10;500 g de pâtes&#10;4 tomates&#10;sel"></textarea>
        <textarea id="recipe-instructions" rows="5" placeholder="Étapes (facultatif)"></textarea>
        <button type="submit">Enregistrer</button>
      </form>
    </details>
    <ul id="recipe-list" class="list"></ul>
    <p id="recipe-empty" class="meta" hidden>Aucune recette : importe un lien, écris-en une,
      ou demande une idée dans le chat.</p>
  </div>
</section>

<!-- Shopping list, shared by the household (no model, 0 tokens) -->
<section id="view-shopping" class="view" hidden>
  <form id="shop-form" class="bar top">
    <input id="shop-text" placeholder="2 l de lait, 6 œufs…" maxlength="150" autocomplete="off" required>
    <button type="submit">Ajouter</button>
  </form>
  <div class="scroll">
    <ul id="shop-list" class="list"></ul>
    <p id="shop-empty" class="meta" hidden>Liste vide.</p>
    <button id="shop-clear" type="button" class="small center" hidden>Retirer les articles cochés</button>
  </div>
</section>
</body>
</html>
