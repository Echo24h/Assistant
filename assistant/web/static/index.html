<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Assistant</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --me: #2f6fde; --me-text: #ffffff; --border: #e2e2e0;
    --ok: #1f8a4c; --no: #b3261e; --warn-bg: #fff6e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --panel: #1f1f22; --text: #ececee; --muted: #9a9aa2;
      --me: #3d7bf0; --me-text: #ffffff; --border: #2e2e33;
      --ok: #3fb06f; --no: #e5605a; --warn-bg: #2f2816;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0; }
  header button {
    border: 1px solid var(--border); background: transparent; color: var(--muted);
    border-radius: 8px; padding: 6px 10px; font-size: 14px;
  }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg {
    max-width: 85%; padding: 10px 12px; border-radius: 14px;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .me { align-self: flex-end; background: var(--me); color: var(--me-text); border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .error { align-self: center; color: var(--no); font-size: 14px; }
  .question { align-self: stretch; background: var(--warn-bg); border: 1px solid var(--border); }
  .question .actions { display: flex; gap: 8px; margin-top: 10px; }
  .question button {
    flex: 1; padding: 10px; border-radius: 10px; border: 0; font-size: 16px; color: #fff;
  }
  .yes { background: var(--ok); } .no { background: var(--no); }
  .question button:disabled { opacity: .4; }
  .meta { align-self: center; color: var(--muted); font-size: 12px; }
  form {
    display: flex; gap: 8px; padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--border); background: var(--panel);
  }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 12px; font: inherit; background: var(--bg); color: var(--text); max-height: 140px;
  }
  form button {
    border: 0; border-radius: 12px; padding: 0 16px; font-size: 16px;
    background: var(--me); color: var(--me-text);
  }
  form button:disabled { opacity: .5; }
</style>
</head>
<body>
<header>
  <h1>Assistant</h1>
  <button id="reset" type="button">Nouvelle conversation</button>
</header>
<main id="log" aria-live="polite"></main>
<form id="form">
  <textarea id="input" rows="1" placeholder="Écris ici…" autocomplete="off"></textarea>
  <button id="send" type="submit">Envoyer</button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");

// Text from the agent can contain email content written by strangers:
// it is ALWAYS inserted with textContent, never innerHTML.
// Only **bold** is rendered, by building <b> elements.
function addMessage(kind, text) {
  const div = document.createElement("div");
  div.className = "msg " + kind;
  text.split(/\*\*(.+?)\*\*/s).forEach((part, i) => {
    const node = i % 2 ? document.createElement("b") : document.createTextNode(part);
    if (i % 2) node.textContent = part;
    div.appendChild(node);
  });
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function addMeta(text) {
  const div = document.createElement("div");
  div.className = "meta";
  div.textContent = text;
  log.appendChild(div);
}

async function post(path, data) {
  const response = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data),
  });
  if (!response.ok) return { type: "error", text: "Erreur " + response.status };
  return response.json();
}

// Show what the server answered: a reply, an error, or a question (✅ / ❌).
function show(event) {
  if (event.type === "question") {
    const box = addMessage("question", "⚠ " + event.text);
    const actions = document.createElement("div");
    actions.className = "actions";
    for (const [label, yes, cls] of [["✅ Oui", true, "yes"], ["❌ Non", false, "no"]]) {
      const button = document.createElement("button");
      button.textContent = label;
      button.className = cls;
      button.onclick = async () => {
        actions.querySelectorAll("button").forEach(b => (b.disabled = true));
        show(await post("/api/confirm", { yes }));
      };
      actions.appendChild(button);
    }
    box.appendChild(actions);
    return; // still busy until the agent's final reply
  }
  addMessage(event.type === "error" ? "error" : "bot", event.text);
  if (event.tokens) addMeta(`tokens : ${event.tokens.in} entrée, ${event.tokens.out} sortie`);
  setBusy(false);
}

function setBusy(busy) {
  send.disabled = busy;
  send.textContent = busy ? "…" : "Envoyer";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || send.disabled) return;
  input.value = "";
  addMessage("me", text);
  setBusy(true);
  try {
    show(await post("/api/ask", { text }));
  } catch {
    show({ type: "error", text: "Connexion impossible (Tailscale activé ?)" });
  }
});

// Enter sends, Shift+Enter makes a new line.
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

document.getElementById("reset").onclick = async () => {
  await post("/api/reset", {});
  log.textContent = "";
  addMeta("Nouvelle conversation");
};
</script>
</body>
</html>
