# The product catalog: the ONLY ingredients and shopping items the app accepts.
# Edited by hand, then restart: the database follows this file (services/products.py).
#
# [key]          stable English id: never change it (the database points to it)
# fr, en         names shown, one per language (fr is used for French...)
# aisle          one of: fruits et légumes, boulangerie, viande et poisson, frais,
#                épicerie, surgelés, boissons, maison, autre
# aliases        other ways to write it (recipes from websites, plurals...)
# shop = false   used in recipes but never bought (tap water): not put on the list
#
# To remove a product: delete it here. If a recipe still uses it, it stays,
# shown as retired (python -m assistant products), until the recipe changes.

