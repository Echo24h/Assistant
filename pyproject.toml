[project]
name = "assistant"
version = "0.1.0"
description = "A personal AI agent with a hand-written tool loop on the Claude API"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.7",
    "python-dotenv>=1.0",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
assistant = "assistant.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["assistant", "assistant.agent", "assistant.agent.tools",
            "assistant.services", "assistant.web"]

[tool.setuptools.package-data]
"assistant.web" = ["static/*.html", "static/*.css", "static/*.js"]
"assistant.services" = ["migrations/*.sql"]
